    edit "G Suite"
        set uuid c6882b28-bbb3-51f1-1de3-78ca469ac9a3
        set member "gmail.com" "wildcard.google.com"
    next
    edit "Microsoft Office 365"
        set uuid c6883a64-bbb3-51f1-6276-32f460d69439
        set member "login.microsoftonline.com" "login.microsoft.com" "login.windows.net"
    next
    edit "VPN-SITIO1_local"
        set uuid e933558c-bc5b-51f1-1ca3-661c4501b98b
        set member "VPN-SITIO1_local_subnet_1"
        set comment "VPN: VPN-SITIO1 (Created by VPN wizard)"
        set allow-routing enable
    next
    edit "VPN-SITIO1_remote"
        set uuid e93899ca-bc5b-51f1-ddea-5c931ef9a180
        set member "VPN-SITIO1_remote_subnet_1"
        set comment "VPN: VPN-SITIO1 (Created by VPN wizard)"
        set allow-routing enable
    next

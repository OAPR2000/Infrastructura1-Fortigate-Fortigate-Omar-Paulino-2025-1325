FW1-1325 # show vpn ipsec phase2-interface
config vpn ipsec phase2-interface
    edit "VPN-SITIO2"
        set phase1name "VPN-SITIO2"
        set proposal des-md5 des-sha1
        set comments "VPN: VPN-SITIO2 (Created by VPN wizard)"
        set src-addr-type name
        set dst-addr-type name
        set src-name "VPN-SITIO2_local"
        set dst-name "VPN-SITIO2_remote"
    next
end

FW1-1325 # show system interface VLAN10
config system interface
    edit "VLAN10"
        set vdom "root"
        set ip 10.13.25.1 255.255.255.128
        set allowaccess ping
        set alias "USUARIOS"
        set device-identification enable
        set role lan
        set snmp-index 15
        set interface "port2"
        set vlanid 10
    next
end

FW1-1325 # show system dhcp server
config system dhcp server
    edit 1
        set ntp-service local
        set default-gateway 10.255.1.1
        set netmask 255.255.255.0
        set interface "fortilink"
        config ip-range
            edit 1
                set start-ip 10.255.1.2
                set end-ip 10.255.1.254
            next
        end
        set vci-match enable
        set vci-string "FortiSwitch" "FortiExtender"
    next
    edit 2
        set default-gateway 10.13.25.1
        set netmask 255.255.255.128
        set interface "VLAN10"
        config ip-range
            edit 1
                set start-ip 10.13.25.10
                set end-ip 10.13.25.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end


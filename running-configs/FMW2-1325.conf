FMW2-1325 # show firewall policy
config firewall policy
    edit 1
        set name "SERVIDOR-INTERNET"
        set uuid c44ab002-bbc1-51f1-30a5-4ab5eb4cb3ba
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN-SERVIDOR"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "vpn_VPN-SITIO1_local_0"
        set uuid e943d312-bc5b-51f1-6a05-12afaa6658bc
        set srcintf "port2"
        set dstintf "VPN-SITIO1"
        set action accept
        set srcaddr "VPN-SITIO1_local"
        set dstaddr "VPN-SITIO1_remote"
        set schedule "always"
        set service "ALL"
        set comments "VPN: VPN-SITIO1 (Created by VPN wizard)"
    next
    edit 3
        set name "vpn_VPN-SITIO1_remote_0"
        set uuid e9b265f2-bc5b-51f1-ea09-fe47223f615d
        set srcintf "VPN-SITIO1"
        set dstintf "port2"
        set action accept

#  Practica: VPN Site-to-Site FortiGate <-> FortiGate
#  Autor: Omar Paulino - Matricula 20251325
#
#  NOTA IMPORTANTE:
#  Toda esta configuracion la hice de forma GRAFICA (GUI) desde el
#  navegador del webterm, salvo la IP inicial de gestion de port2.
#  Este archivo es la salida de los comandos "show ..." del CLI, que
#  muestran en texto lo que la GUI guardo. Lo incluyo como evidencia
#  del running-config real del equipo.
#  La clave precompartida aparece cifrada (ENC ...) porque FortiOS
#  nunca la muestra en texto plano.
# =====================================================================

FW1-1325 # show system global
config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FW1-1325"
    set timezone 04
end

FW1-1325 # show system interface port1
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.42.13 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
        set lldp-reception enable
        set role wan
        set snmp-index 1
        set secondary-IP enable
        config secondaryip
            edit 1
                set ip 200.25.13.13 255.255.255.224
                set allowaccess ping
            next
        end
    next
end

FW1-1325 # show system interface port2
config system interface
    edit "port2"
        set vdom "root"
        set ip 192.168.13.1 255.255.255.0
        set allowaccess ping https http
        set type physical
        set alias "GESTION"
        set device-identification enable
        set lldp-transmission enable
        set role lan
        set snmp-index 2
    next
end

FW1-1325 # show system dns
config system dns
    set primary 8.8.8.8
    set secondary 1.1.1.1
end

FW1-1325 # show router static
config router static
    edit 1
        set gateway 192.168.42.1
        set device "port1"
    next
    edit 2
        set device "VPN-SITIO2"
        set comment "VPN: VPN-SITIO2 (Created by VPN wizard)"
        set dstaddr "VPN-SITIO2_remote"
    next
    edit 3
        set distance 254
        set comment "VPN: VPN-SITIO2 (Created by VPN wizard)"
        set blackhole enable
        set dstaddr "VPN-SITIO2_remote"
    next
end

